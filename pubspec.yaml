name: smart_sme_app
description: "Smart SME Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🔥 State Management (STABLE)
  get: ^4.7.3

  # 🔐 Biometric (STABLE & COMPATIBLE)
  local_auth: ^2.1.6

  # 💾 Local Storage (RECOMMENDED)
  get_storage: ^2.1.1

  # 🌐 (OPTIONAL - nanti untuk API)
  http: ^1.2.1

  # 📧 Google Sign In for OTP
  google_sign_in: ^6.2.2
  flutter_barcode_scanner: ^2.0.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - "assets/Smart SME Logo Design.png"
    - "assets/google.png"

dependency_overrides:
  flutter_barcode_scanner:
    git:
      url: https://github.com/decodevM/flutter_barcode_scanner.git
      ref: flutter-3.29